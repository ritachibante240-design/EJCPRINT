services:
  - type: web
    name: ejcprint-api
    runtime: node
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate:mysql && npm run build
    startCommand: npm run prisma:migrate:mysql && node dist/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true